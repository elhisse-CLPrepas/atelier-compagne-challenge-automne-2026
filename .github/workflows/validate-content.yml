name: A2 — Contrôler les contenus

on:
  pull_request:
    paths:
      - "02-CONTENUS/QUOTIDIEN/**"
      - "config/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Lire le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exécuter les tests
        run: npm test

      - name: Contrôler tous les contenus quotidiens
        run: npm run validate
